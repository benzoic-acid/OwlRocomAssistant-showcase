<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ORA 精灵筛选操作演示：家族快捷筛选、极限声音奖牌、性格与个体资质。">
  <meta name="theme-color" content="#f4f0e8">
  <title>精灵筛选演示 · OwlRocomAssistant</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #292923; background: #f4f0e8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-underline-offset: 4px; }
    a:hover { color: #876121; }
    a:focus-visible, button:focus-visible, video:focus-visible { outline: 3px solid #876121; outline-offset: 5px; }
    .page { width: min(1920px, calc(100% - 64px)); margin: 0 auto; padding: 28px 0 24px; }
    .topbar, .brand, .intro, .actions, .footer { display: flex; align-items: center; gap: 16px; }
    .topbar, .intro, .footer { justify-content: space-between; }
    .brand { gap: 10px; text-decoration: none; font-size: 14px; font-weight: 650; }
    .monogram { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: #2a2c27; color: #f9f4e8; font-size: 13px; letter-spacing: .05em; }
    .repo { font-size: 14px; }
    .intro { align-items: flex-end; flex-wrap: wrap; margin: 28px 0 20px; }
    h1 { margin: 0 0 10px; font-size: clamp(24px, 2.2vw, 36px); line-height: 1.25; letter-spacing: -.03em; }
    .description { margin: 0; color: #656459; font-size: 15px; line-height: 1.7; }
    .actions { flex-wrap: wrap; gap: 10px; }
    button, .download { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 10px 16px; border: 1px solid #d5cdbd; border-radius: 10px; background: #fbf8f0; color: #34372f; font: inherit; font-size: 14px; line-height: 1.4; text-decoration: none; cursor: pointer; }
    button:hover, .download:hover { border-color: #b4a17d; background: #fffdf8; color: #34372f; }
    .fullscreen { border-color: #34372f; background: #34372f; color: #fff9ed; }
    .fullscreen:hover { background: #484c40; color: #fff9ed; }
    .player { overflow: hidden; border: 1px solid #d5cdbd; border-radius: 16px; background: #181b1b; box-shadow: 0 12px 36px #40391c0c; }
    video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #181b1b; }
    video:fullscreen { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .footer { align-items: flex-start; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; color: #737064; font-size: 13px; line-height: 1.7; }
    .footer p { margin: 0; }
    .playback-error { color: #9b3d25; }
    [hidden] { display: none !important; }
    @media (max-width: 640px) {
      .page { width: calc(100% - 24px); padding-top: 16px; }
      .brand-name { max-width: 140px; overflow-wrap: anywhere; line-height: 1.3; }
      .intro { margin-top: 24px; gap: 16px; }
      .description { font-size: 14px; }
      .actions { gap: 8px; }
      button, .download { min-height: 44px; padding: 10px 12px; }
      .player { border-radius: 10px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="https://github.com/benzoic-acid/OwlRocomAssistant-showcase">
        <span class="monogram" aria-hidden="true">ORA</span>
        <span class="brand-name">OwlRocomAssistant</span>
      </a>
      <a class="repo" href="https://github.com/benzoic-acid/OwlRocomAssistant-showcase#界面预览">返回项目介绍 ↗</a>
    </header>

    <section aria-labelledby="demo-title">
      <div class="intro">
        <div>
          <h1 id="demo-title">精灵筛选演示</h1>
          <p class="description">家族快捷筛选 → 极限声音奖牌 → 性格与个体资质</p>
        </div>
        <div class="actions">
          <button id="replay" type="button" hidden>重新播放</button>
          <button id="fullscreen" class="fullscreen" type="button" hidden>全屏观看</button>
          <a class="download" href="videos/pet-filter-demo.mp4" download>下载视频</a>
        </div>
      </div>

      <div class="player">
        <video id="demo" controls muted loop playsinline preload="metadata" width="1920" height="1080"
          poster="screenshots/pet-filter-demo.png" aria-label="精灵筛选操作演示">
          <source src="videos/pet-filter-demo.mp4" type="video/mp4">
          当前浏览器无法播放视频。<a href="videos/pet-filter-demo.mp4">下载 MP4 观看</a>。
        </video>
      </div>
      <div class="footer">
        <p>建议全屏观看，便于查看筛选项与资质提示。</p>
        <p>1920 × 1080 · 约 28 秒 · 演示已按 1.5 倍速剪辑</p>
      </div>
      <p id="playback-error" class="description playback-error" role="status" hidden>视频暂时无法播放，请稍后重试或下载视频观看。</p>
    </section>
  </main>

  <script>
    const video = document.querySelector('#demo');
    const replay = document.querySelector('#replay');
    const fullscreen = document.querySelector('#fullscreen');
    const playbackError = document.querySelector('#playback-error');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');

    video.muted = true;
    const play = () => { video.play().catch(() => {}); };
    replay.hidden = false;
    replay.addEventListener('click', () => {
      video.currentTime = 0;
      play();
    });

    const supportsFullscreen = document.fullscreenEnabled && typeof video.requestFullscreen === 'function';
    if (supportsFullscreen || typeof video.webkitEnterFullscreen === 'function') {
      fullscreen.hidden = false;
      fullscreen.addEventListener('click', () => {
        if (supportsFullscreen) {
          video.requestFullscreen().catch(() => { video.focus(); });
        } else {
          video.webkitEnterFullscreen();
        }
      });
    }

    video.addEventListener('error', () => { playbackError.hidden = false; });
    video.querySelector('source').addEventListener('error', () => { playbackError.hidden = false; });
    motionPreference.addEventListener('change', event => {
      if (event.matches) video.pause();
    });
    if (!motionPreference.matches) play();
  </script>
</body>
</html>
